<!DOCTYPE html>
<html lang="th" data-lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title data-th="ลงทะเบียนรับคำปรึกษา | SME Decode" data-en="Register for Consultation | SME Decode">ลงทะเบียนรับคำปรึกษา | SME Decode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main class="container">

    <!-- ─── Form view ─── -->
    <section id="form-view">

      <!-- Language Toggle -->
      <div class="lang-bar">
        <div class="lang-switch" id="lang-switch" data-active="th" role="group" aria-label="Language">
          <button type="button" class="lang-option" data-lang="th">TH</button>
          <button type="button" class="lang-option" data-lang="en">EN</button>
          <span class="lang-slider" aria-hidden="true"></span>
        </div>
      </div>

      <!-- Hero -->
      <header class="hero">
        <div class="logo-card">
          <svg class="logo-svg" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" aria-label="SME Decode">
            <!-- SME — navy, with subtle glitch-shadow on the E -->
            <g font-family="Inter, 'Noto Sans Thai', sans-serif" font-weight="800" letter-spacing="1">
              <text x="120" y="74" text-anchor="middle" font-size="56" fill="#ffffff">SME</text>
              <text x="156" y="74" text-anchor="middle" font-size="56" fill="#e8b84b" opacity="0.55">E</text>
            </g>
            <!-- DECODE — white, with magnifier replacing the O -->
            <g font-family="Inter, 'Noto Sans Thai', sans-serif" font-weight="800" letter-spacing="1">
              <text x="120" y="138" text-anchor="middle" font-size="48" fill="#ffffff">DEC  DE</text>
            </g>
            <!-- Magnifier replacing the second "O" in DECODE -->
            <g transform="translate(132 122)">
              <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
              <!-- mini bar chart inside lens -->
              <rect x="-7" y="-2" width="3" height="7" fill="#16b899"/>
              <rect x="-2" y="-6" width="3" height="11" fill="#16b899"/>
              <rect x="3"  y="-4" width="3" height="9" fill="#16b899"/>
              <!-- handle -->
              <line x1="11" y1="11" x2="19" y2="19" stroke="#e8b84b" stroke-width="4" stroke-linecap="round"/>
            </g>
            <!-- Heartbeat / ECG line through DECODE -->
            <path d="M10 168 L70 168 L82 158 L94 178 L110 148 L128 178 L148 162 L168 168 L230 168"
                  fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- gold accent on heartbeat -->
            <path d="M110 148 L128 178 L148 162" fill="none" stroke="#e8b84b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 data-th="ลงทะเบียนรับคำปรึกษา" data-en="Register for Consultation">ลงทะเบียนรับคำปรึกษา</h1>
        <p class="sub" data-th="ที่ปรึกษาทางการเงิน (FA) เชี่ยวชาญด้าน<br/>IPO · M&amp;A · Refinance · Restructuring" data-en="Financial Advisor (FA) specializing in<br/>IPO · M&amp;A · Refinance · Restructuring">ที่ปรึกษาทางการเงิน (FA) เชี่ยวชาญด้าน<br/>IPO · M&amp;A · Refinance · Restructuring</p>
      </header>

      <form id="lead-form" novalidate>

        <div class="field">
          <label for="name"><span data-th="ชื่อ–นามสกุล" data-en="Full Name">ชื่อ–นามสกุล</span> <span class="req">*</span></label>
          <input type="text" id="name" name="name" required autocomplete="name" />
        </div>

        <div class="field">
          <label for="phone"><span data-th="เบอร์โทร" data-en="Phone Number">เบอร์โทร</span> <span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" required inputmode="numeric"
                 placeholder="0812345678" pattern="^0[0-9]{8,9}$" />
          <small class="hint" data-th="เบอร์มือถือไทย 10 หลัก" data-en="Thai mobile number, 10 digits">เบอร์มือถือไทย 10 หลัก</small>
        </div>

        <div class="field">
          <label for="email"><span data-th="อีเมล" data-en="Email">อีเมล</span> <span class="req">*</span></label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>

        <div class="row">
          <div class="field">
            <label for="company"><span data-th="บริษัท" data-en="Company">บริษัท</span> <span class="req">*</span></label>
            <input type="text" id="company" name="company" required />
          </div>
          <div class="field">
            <label for="position"><span data-th="ตำแหน่ง" data-en="Position">ตำแหน่ง</span> <span class="req">*</span></label>
            <input type="text" id="position" name="position" required />
          </div>
        </div>

        <div class="field">
          <label><span data-th="วัตถุประสงค์ที่สนใจ" data-en="Service Interest">วัตถุประสงค์ที่สนใจ</span> <span class="req">*</span></label>
          <div class="radio-group" role="radiogroup">
            <label class="radio"><input type="radio" name="purpose" value="IPO" required /><span>IPO</span></label>
            <label class="radio"><input type="radio" name="purpose" value="M&A" /><span>M&amp;A</span></label>
            <label class="radio"><input type="radio" name="purpose" value="Refinance" /><span>Refinance</span></label>
            <label class="radio"><input type="radio" name="purpose" value="Restructuring" /><span>Restructuring</span></label>
            <label class="radio"><input type="radio" name="purpose" value="อื่นๆ" /><span data-th="อื่นๆ" data-en="Other">อื่นๆ</span></label>
          </div>
        </div>

        <div class="field" id="purpose-other-wrap" hidden>
          <label for="purposeOther">
            <span data-th="โปรดระบุวัตถุประสงค์" data-en="Please specify">โปรดระบุวัตถุประสงค์</span>
            <span class="req">*</span>
          </label>
          <input type="text" id="purposeOther" name="purposeOther"
                 data-placeholder-th="อยากให้เราช่วยอะไร?"
                 data-placeholder-en="What can we help you with?"
                 placeholder="อยากให้เราช่วยอะไร?" />
        </div>

        <div class="field">
          <label for="revenueRange"><span data-th="ช่วงรายได้ปีล่าสุด" data-en="Latest Annual Revenue">ช่วงรายได้ปีล่าสุด</span> <span class="req">*</span></label>
          <select id="revenueRange" name="revenueRange" required>
            <option value="" data-th="— เลือก —" data-en="— Select —">— เลือก —</option>
            <option value="<100"    data-th="น้อยกว่า 100 ล้านบาท"   data-en="Less than 100M THB">น้อยกว่า 100 ล้านบาท</option>
            <option value="100-500" data-th="100 – 500 ล้านบาท"      data-en="100 – 500M THB">100 – 500 ล้านบาท</option>
            <option value="500-1000" data-th="500 – 1,000 ล้านบาท"   data-en="500 – 1,000M THB">500 – 1,000 ล้านบาท</option>
            <option value="1000+"   data-th="มากกว่า 1,000 ล้านบาท"  data-en="Over 1,000M THB">มากกว่า 1,000 ล้านบาท</option>
          </select>
        </div>

        <div class="field">
          <label for="profitRange"><span data-th="ช่วงกำไรปีล่าสุด" data-en="Latest Annual Profit">ช่วงกำไรปีล่าสุด</span> <span class="req">*</span></label>
          <select id="profitRange" name="profitRange" required>
            <option value="" data-th="— เลือก —" data-en="— Select —">— เลือก —</option>
            <option value="loss"  data-th="ขาดทุน"              data-en="Net Loss">ขาดทุน</option>
            <option value="<10"   data-th="น้อยกว่า 10 ล้านบาท" data-en="Less than 10M THB">น้อยกว่า 10 ล้านบาท</option>
            <option value="10-50" data-th="10 – 50 ล้านบาท"     data-en="10 – 50M THB">10 – 50 ล้านบาท</option>
            <option value="50-100" data-th="50 – 100 ล้านบาท"   data-en="50 – 100M THB">50 – 100 ล้านบาท</option>
            <option value="100+"  data-th="มากกว่า 100 ล้านบาท" data-en="Over 100M THB">มากกว่า 100 ล้านบาท</option>
          </select>
        </div>

        <div class="field">
          <label for="note">
            <span data-th="ข้อความเพิ่มเติม" data-en="Additional Info">ข้อความเพิ่มเติม</span>
            <small data-th="(ไม่บังคับ)" data-en="(optional)">(ไม่บังคับ)</small>
          </label>
          <textarea id="note" name="note" rows="3"
            data-placeholder-th="อุตสาหกรรม, ระยะเวลาที่ต้องการ, รายละเอียดอื่นๆ"
            data-placeholder-en="Industry, timeline, additional details"
            placeholder="อุตสาหกรรม, ระยะเวลาที่ต้องการ, รายละเอียดอื่นๆ"></textarea>
        </div>

        <div class="field consent">
          <label class="checkbox">
            <input type="checkbox" id="pdpa" name="pdpa" required />
            <span>
              <span data-th="ยินยอมให้ SME Decode เก็บและใช้ข้อมูลส่วนบุคคลเพื่อติดต่อกลับ ตาม" data-en="I consent to SME Decode collecting and using my personal data as per">ยินยอมให้ SME Decode เก็บและใช้ข้อมูลส่วนบุคคลเพื่อติดต่อกลับ ตาม</span>
              <a href="policy.html" target="_blank" rel="noopener" data-th="นโยบายความเป็นส่วนตัว" data-en="Privacy Policy">นโยบายความเป็นส่วนตัว</a>
            </span>
          </label>
        </div>

        <div id="error-banner" class="error-banner" hidden></div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span class="btn-text" data-th="ส่งข้อมูล" data-en="Submit">ส่งข้อมูล</span>
          <span class="btn-loader" hidden></span>
        </button>

        <p class="footer-note" data-th="ทีม FA จะติดต่อกลับภายใน 24 ชั่วโมง" data-en="Our FA team will contact you within 24 hours">ทีม FA จะติดต่อกลับภายใน 24 ชั่วโมง</p>
      </form>
    </section>

    <!-- ─── Success view ─── -->
    <section id="success-view" hidden>
      <div class="success-card">
        <div class="check-circle">
          <svg viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="24" fill="none" stroke="#16b899" stroke-width="2"/>
            <path fill="none" stroke="#16b899" stroke-width="4" stroke-linecap="round"
                  stroke-linejoin="round" d="M14 27 L23 36 L39 18"/>
          </svg>
        </div>
        <h2 data-th-template="ขอบคุณ {name} 🙏" data-en-template="Thank you, {name} 🙏">
          ขอบคุณ <span id="success-name"></span> 🙏
        </h2>
        <p class="success-msg">
          <span data-th="เราได้รับข้อมูลของคุณเรียบร้อยแล้ว" data-en="We've received your information.">เราได้รับข้อมูลของคุณเรียบร้อยแล้ว</span><br/>
          <span data-th="ทีม FA ของ SME Decode จะติดต่อกลับภายใน" data-en="Our FA team will contact you within">ทีม FA ของ SME Decode จะติดต่อกลับภายใน</span>
          <strong data-th="24 ชั่วโมง" data-en="24 hours">24 ชั่วโมง</strong>
        </p>
        <button type="button" id="close-btn" class="btn-primary"
                data-th="ปิดหน้านี้" data-en="Close">ปิดหน้านี้</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
